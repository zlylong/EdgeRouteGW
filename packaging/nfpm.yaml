# nfpm packaging spec. Build the binary first (make build), then:
#   VERSION=2.0.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: edgeroutegw
arch: ${ARCH}
platform: linux
version: ${VERSION}
# semver: a pre-release like 2.0.0-rc.1 becomes 2.0.0~rc.1 so dpkg sorts it before 2.0.0.
version_schema: semver
section: net
priority: optional
maintainer: zlylong <insuencu@zantio.xyz>
description: |
  EdgeRouteGW transparent proxy gateway (2.0).
  Declarative control plane for Xray, Mosdns, nftables and FRR.
vendor: EdgeRouteGW
homepage: https://github.com/zlylong/EdgeRouteGW
license: GPL-3.0

depends:
  - nftables
  - ca-certificates
  - iproute2
  - ethtool
recommends:
  - frr

contents:
  - src: bin/edgeroutegw
    dst: /usr/bin/edgeroutegw
    file_info:
      mode: 0755
  - src: packaging/systemd/edgeroutegw.service
    dst: /lib/systemd/system/edgeroutegw.service
    file_info:
      mode: 0644
  - src: packaging/systemd/edgeroutegw-xray.service
    dst: /lib/systemd/system/edgeroutegw-xray.service
    file_info:
      mode: 0644
  - src: packaging/systemd/edgeroutegw-mosdns.service
    dst: /lib/systemd/system/edgeroutegw-mosdns.service
    file_info:
      mode: 0644
  - src: packaging/sysctl/99-edgeroutegw.conf
    dst: /etc/sysctl.d/99-edgeroutegw.conf
    type: config
    file_info:
      mode: 0644
  - src: packaging/modules-load.d-edgeroutegw.conf
    dst: /etc/modules-load.d/edgeroutegw.conf
    type: config
    file_info:
      mode: 0644
  - src: packaging/env.example
    dst: /etc/edgeroutegw/edgeroutegw.env
    type: config|noreplace
    file_info:
      mode: 0640
  - dst: /var/lib/edgeroutegw
    type: dir
    file_info:
      mode: 0750
  - dst: /etc/edgeroutegw
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
