# Installed by edgeroutegw. systemd-networkd removes every routing policy
# rule and route it did not configure itself each time it (re)starts; the
# gateway's TPROXY and WireGuard rules ("ip rule fwmark ... lookup 100/3xx")
# are exactly that, and a networkd restart (unattended-upgrades + needrestart
# is enough) used to cut every client off until edgeroutegw was restarted.
# The control plane now restores them within seconds; this keeps networkd
# from removing them in the first place. Read at networkd start only.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
