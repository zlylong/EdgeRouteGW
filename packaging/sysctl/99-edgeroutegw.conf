# EdgeRouteGW 2.0 kernel tuning. Installed by the package; the service also
# reconciles the per-interface send_redirects flags at runtime because
# conf.all/conf.default do not cover interfaces that already existed.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.route_localnet = 1

net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_max_tw_buckets = 500000
net.core.somaxconn = 32768

net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 16384 16777216
net.ipv4.tcp_fastopen = 3
# Conntrack sizing (nf_conntrack_max and the TCP timeouts) is applied by the
# service at runtime when the module is present: the ruleset does not use
# conntrack itself, so the keys may not exist at boot.
