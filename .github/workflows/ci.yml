name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  web:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck
        run: cd web && bun run typecheck
      - name: Test
        run: cd web && bun run test
      - name: Build
        run: cd web && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
          include-hidden-files: true

  backend:
    name: Backend (vet, test, race, build)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Build amd64 (static)
        env:
          CGO_ENABLED: "0"
        run: make build
      - name: Build arm64 (static, no cross toolchain needed)
        env:
          CGO_ENABLED: "0"
        run: make build-arm64
      - name: Smoke
        run: |
          bin/edgeroutegw version
          bin/edgeroutegw migrate -data-dir /tmp/ergw
          bin/edgeroutegw serve -no-reconcile -listen 127.0.0.1:18080 -data-dir /tmp/ergw &
          sleep 1
          B=http://127.0.0.1:18080
          curl -fsS $B/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/v2/state)" = 401
          curl -fsS $B/ | grep -q '<div id="app">'
          PW=$(cat /tmp/ergw/bootstrap_password.txt)
          curl -fsS -c /tmp/jar -H 'Content-Type: application/json' -d "{\"password\":\"$PW\"}" $B/api/v2/auth/login | grep -q '"must_change_password":true'
          CSRF=$(grep ergw_csrf /tmp/jar | awk '{print $7}')
          curl -fsS -b /tmp/jar $B/api/v2/state | tee /dev/stderr | grep -q '"mode":"A"'
          curl -fsS -b /tmp/jar -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"name":"main"}' $B/api/v2/rule-sets | grep -q '"generation":1'
          curl -fsS -b /tmp/jar $B/api/v2/artifacts/nftables | grep -q 'table inet edgeroutegw'
          kill %1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: make build
      - name: Install Playwright
        run: cd web && bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - name: Run suite
        run: scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  package:
    name: Package (.deb via nfpm)
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/web/dist
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w \
            -X github.com/zlylong/EdgeRouteGW/internal/version.Version=$VERSION \
            -X github.com/zlylong/EdgeRouteGW/internal/version.Commit=$(git rev-parse --short=12 HEAD) \
            -X github.com/zlylong/EdgeRouteGW/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/edgeroutegw ./cmd/edgeroutegw
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: edgeroutegw-${{ matrix.arch }}-deb
          path: dist/*.deb
