name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Backend
        run: |
          cd backend
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o proxygw-backend-linux-amd64 .
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -o proxygw-backend-linux-arm64 .

      - name: Extract release notes from changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ /^## \[[^]]+\] - / {
              if (found) exit
            }
            index($0, "## [" ver "] - ") == 1 { found=1 }
            found { print }
          ' docs/CHANGELOG.md > /tmp/release_notes.md
          test -s /tmp/release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ contains(github.ref_name, '-rc.') && format('EdgeRouteGW {0} Pre-release', github.ref_name) || format('EdgeRouteGW {0} Stable', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body_path: /tmp/release_notes.md
          files: |
            backend/proxygw-backend-linux-amd64
            backend/proxygw-backend-linux-arm64
